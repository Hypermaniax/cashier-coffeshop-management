services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/cashier"
      JWT_SECRET: "${JWT_SECRET}"
      UPLOAD_MAX_SIZE_MB: "5"
      NODE_ENV: "production"
    volumes:
      - uploads:/app/public/uploads
      - qris:/app/storage
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashier
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  uploads:
  qris:
  pgdata:
